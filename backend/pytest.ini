[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Suppress only the categories of noise we've confirmed are not bugs:
# - sklearn deprecates internal params on every minor release
# - matplotlib emits PendingDeprecation on import (unused but transitive)
# - sklearn raises UserWarning("Solver terminated early" / "X has feature names")
#   in CalibratedClassifierCV's CV folds when the synthetic test data is tiny;
#   real fits don't hit it.
# We intentionally do NOT blanket-ignore UserWarning — only the known-noisy ones.
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:Solver terminated early:UserWarning
    ignore:X has feature names:UserWarning
    ignore:.*y_pred contains classes not in y_true.*:UserWarning
    ignore:Use of `register_canonical` in.*:UserWarning
